  intl: ^0.20.3
  material_ui: ^1.11.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
