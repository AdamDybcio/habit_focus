publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
